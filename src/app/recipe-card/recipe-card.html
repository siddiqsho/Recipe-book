<head>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_back_ios" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=chevron_right" />
</head>
<div class="parent-cards">

    <div class="recipe-card">
        <div class="flipper" [class.flipped]="flipper">
            <div class="front">
                <img class="cards-img" [src]="recipe.image" [alt]="recipe.title">
                <div class="card-content">
                    <h3>{{recipe.title}}</h3>
                    <p class="front-des">{{shorted(recipe.description)}}</p>
                    <br>
                    <button class="ingredient-btn" (click)="flipperCard()">Ингредиенты <span class="material-symbols-outlined">chevron_right</span> </button>
                </div>
            </div>

            <div class="back">
                
                <div class="back-btn" (click)="flipperCard()"><span class="material-symbols-outlined">chevron_right</span></div>

                <p class="back-desc">{{recipe.description}}</p>

                <div class="ingredient">
                    <h4>Ингредиенты</h4>
                    @for(ingredient of recipe.ingredients;track ingredient){
                    <p class="back-span">
                        <span>{{ingredient.name}}</span>
                        <span>{{ingredient.amount}}</span>
                    </p>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
