<div class="parent-cards">

    <div class="recipe-card">
        <div class="flipper" [class.flipped]="flipper">
            <div class="front">
                <img class="cards-img" [src]="recipe.image" [alt]="recipe.title">
                <div class="card-content">
                    <h3>{{recipe.title}}</h3>
                    <p class="front-des">{{recipe.description | slice : 0: 60}}...</p>
                    <br>
                    <button class="ingredient-btn" (click)="flipperCard()">Ингредиенты <span>&gt;</span></button>
                </div>
            </div>

            <div class="back">

                <div class="back-information">
                    <button class="back-btn" (click)="flipperCard()"><span>&lt;</span></button>
                    <p class="back-desc">{{recipe.description}}</p>
                </div>

                <div class="ingredient">
                    <h4>Ингредиенты</h4>
                    @for(ingredient of recipe.ingredients;track ingredient){
                    <p class="back-span">
                        <span>{{ingredient.name}}</span>
                        <span>{{ingredient.amount}}</span>
                    </p>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
